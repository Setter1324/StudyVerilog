name: fonts-once

# 일회용: 글꼴을 받아 이 브랜치에 커밋한다. 세션 셸에서 GitHub 릴리스를 받을 수 없어서 Actions로 한다(최종계획서 0.3).
# 커밋이 끝나면 이 파일을 지운다.
on:
  push:
    branches: [feat/ui-foundation]
    paths: ['.github/workflows/fonts-once.yml']

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 글꼴 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tmp=$(mktemp -d)
          dest=public/fonts
          rm -rf "$dest" && mkdir -p "$dest/pretendard" "$dest/jetbrains-mono" "$dest/d2coding"

          # Pretendard: 가변 글꼴의 동적 서브셋(필요한 글자 구간만 받는다)
          gh release download -R orioncactus/pretendard --pattern 'Pretendard-*.zip' -D "$tmp/pre"
          unzip -q "$tmp"/pre/*.zip -d "$tmp/pre/x"
          sub=$(find "$tmp/pre/x" -type d -path '*variable/woff2-dynamic-subset' | head -n 1)
          css=$(find "$tmp/pre/x" -type f -name 'pretendardvariable-dynamic-subset.css' | head -n 1)
          cp "$sub"/*.woff2 "$dest/pretendard/"
          # css 안의 글꼴 경로를 같은 폴더로 맞춘다
          sed -E 's#url\((["'"'"']?)[^)"'"'"']*/([^/)"'"'"']+\.woff2)#url(\1\2#g' "$css" > "$dest/pretendard/pretendard.css"
          gh api repos/orioncactus/pretendard/license --jq .content | base64 -d > "$dest/pretendard/LICENSE.txt"
          gh release view -R orioncactus/pretendard --json tagName --jq .tagName > "$dest/pretendard/VERSION"

          # JetBrains Mono: Regular, Bold woff2
          gh release download -R JetBrains/JetBrainsMono --pattern 'JetBrainsMono-*.zip' -D "$tmp/jbm"
          unzip -q "$tmp"/jbm/*.zip -d "$tmp/jbm/x"
          for w in Regular Bold; do
            cp "$(find "$tmp/jbm/x" -type f -name "JetBrainsMono-$w.woff2" | head -n 1)" "$dest/jetbrains-mono/"
          done
          gh api repos/JetBrains/JetBrainsMono/license --jq .content | base64 -d > "$dest/jetbrains-mono/OFL.txt"
          gh release view -R JetBrains/JetBrainsMono --json tagName --jq .tagName > "$dest/jetbrains-mono/VERSION"

          # D2Coding: 한글 구간만 woff2로 (코드 속 한글 주석용)
          gh release download -R naver/d2codingfont --pattern '*.zip' -D "$tmp/d2"
          unzip -q -O cp949 "$tmp"/d2/*.zip -d "$tmp/d2/x" || unzip -q "$tmp"/d2/*.zip -d "$tmp/d2/x"
          ttf=$(find "$tmp/d2/x" -type f -iname 'D2Coding-Ver*.ttf' ! -iname '*bold*' | head -n 1)
          pip install --quiet fonttools brotli
          pyftsubset "$ttf" --unicodes='U+1100-11FF,U+3130-318F,U+AC00-D7A3' \
            --flavor=woff2 --layout-features='*' --output-file="$dest/d2coding/D2Coding-hangul.woff2"
          gh api repos/naver/d2codingfont/license --jq .content | base64 -d > "$dest/d2coding/LICENSE.txt" \
            || echo "SIL Open Font License 1.1 — https://github.com/naver/d2codingfont" > "$dest/d2coding/LICENSE.txt"
          gh release view -R naver/d2codingfont --json tagName --jq .tagName > "$dest/d2coding/VERSION"

          du -sh "$dest"/*
          ls "$dest/pretendard" | head
          head -c 600 "$dest/pretendard/pretendard.css"
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git commit -m "chore: 글꼴 추가 (Pretendard, JetBrains Mono, D2Coding 한글 서브셋)"
          git push
