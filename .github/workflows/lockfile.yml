name: lockfile (일회용)

# package-lock.json이 없을 때 한 번만 만들어 이 브랜치에 커밋한다. 끝나면 이 파일을 지운다.
on:
  push:
    branches: [chore/scaffold]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: lock 파일이 없으면 만든다
        run: |
          if [ -f package-lock.json ]; then echo "이미 있음"; exit 0; fi
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: package-lock.json 생성"
          git push
