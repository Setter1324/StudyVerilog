name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 엔진 골든 테스트: 네이티브 Icarus Verilog와 브라우저 엔진(wasm)의 결과를 비교한다. (최종계획서 13.1)
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 네이티브 iverilog 설치
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: 브라우저 엔진 받기 (VeriSim wasm, 해시 확인)
        run: node engine/fetch-verisim.mjs engine/.cache/verisim
      - name: 네이티브로 실행
        run: bash engine/golden/run-native.sh engine/golden engine/.out/native
      - name: wasm으로 실행
        run: node engine/golden/run-wasm.mjs engine/.cache/verisim engine/golden engine/.out/wasm
      - name: 비교
        run: node engine/golden/compare.mjs engine/golden engine/.out
        env:
          GOLDEN_PRINT_NATIVE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-out
          include-hidden-files: true
          path: engine/.out
