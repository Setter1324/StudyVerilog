name: engine

# Icarus Verilog를 WebAssembly로 직접 빌드하고, 골든 테스트로 네이티브와 비교한다. (최종계획서 11.3)
# engine-v* 태그를 push하면 결과를 Release 자산으로 올린다. 앱 빌드는 고정한 Release를 받아 쓴다.
on:
  workflow_dispatch:
  push:
    tags: ['engine-v*']
  pull_request:
    paths:
      - 'engine/build/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 빌드 도구와 네이티브 iverilog 설치
        run: sudo apt-get update && sudo apt-get install -y autoconf gperf bison flex make g++ python3 iverilog
      - name: Emscripten 캐시
        uses: actions/cache@v4
        with:
          path: engine/.cache/build/emsdk
          key: emsdk-6.0.0-${{ runner.os }}
      - name: 엔진 빌드
        run: bash engine/build/build.sh engine/.cache/built
      - name: 해시
        working-directory: engine/.cache/built
        run: sha256sum ivlpp.js ivlpp.wasm ivl.js ivl.wasm vvp.js vvp.wasm | tee SHA256SUMS
      - name: 골든 테스트 (네이티브 대 직접 빌드한 wasm)
        run: |
          bash engine/golden/run-native.sh engine/golden engine/.out/native
          node engine/golden/run-wasm.mjs engine/.cache/built engine/golden engine/.out/wasm
          node engine/golden/compare.mjs engine/golden engine/.out
      - uses: actions/upload-artifact@v4
        with:
          name: iverilog-wasm
          path: |
            engine/.cache/built/*.js
            engine/.cache/built/*.wasm
            engine/.cache/built/SHA256SUMS
            engine/.cache/built/IVERILOG_COMMIT
            engine/.out/report.md

  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iverilog-wasm
          path: dist-engine
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-engine
          {
            echo "Icarus Verilog (GPL-2.0-or-later)를 WebAssembly로 빌드한 엔진."
            echo
            echo "- iverilog 커밋: $(cat engine/.cache/built/IVERILOG_COMMIT 2>/dev/null || cat IVERILOG_COMMIT 2>/dev/null)"
            echo "- 소스: https://github.com/steveicarus/iverilog"
            echo "- 빌드 스크립트와 패치: engine/build/ (이 태그)"
            echo
            cat engine/.out/report.md 2>/dev/null || true
          } > notes.md
          files=$(find . -maxdepth 4 -type f \( -name '*.js' -o -name '*.wasm' -o -name SHA256SUMS -o -name IVERILOG_COMMIT \))
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
